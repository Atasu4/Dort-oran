<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GÖKÇEN ANALİZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0d10; --surface:#14181d; --fg:#f3f0e8; --muted:#9a9386; --line:#2a261f; --gold:#e4d0a2; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); color:var(--fg); }
    body { font-family:Manrope, sans-serif; padding:10px; }
    .frame { min-height:calc(100vh - 20px); border:1px solid var(--gold); box-shadow:inset 0 0 0 5px var(--bg), inset 0 0 0 6px rgba(228,208,162,.55); padding:10px 8px 28px; }
    main { width:min(720px,100%); margin:0 auto; }
    h1, h2 { font-family:"Bodoni Moda", Georgia, serif; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
    h1 { margin:10px 0 0; text-align:center; font-size:24px; }
    h2 { margin:16px 0 6px; font-size:14px; }
    .rule { width:88px; height:1px; margin:10px auto 14px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
    .meta { color:var(--muted); font-size:13px; }
    article { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:6px; }
    .top { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
    .teams { margin:2px 0; font-size:14px; font-weight:600; }
    .pick { color:#3dd68c; font-size:13px; }
    .opta { color:#e4d0a2; font-weight:600; }
    #lock { position:fixed; inset:0; z-index:30; background:#0b0d10; display:flex; align-items:center; justify-content:center; padding:24px; }
    #lock.hide { display:none; }
    #lock form { width:min(320px,100%); }
    input, button { width:100%; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:12px; font:inherit; }
    input { height:44px; padding:0 14px; margin:8px 0; }
    button { height:44px; background:#2a2418; color:var(--gold); }
  </style>
</head>
<body>
  <div id="lock">
    <form id="lock-form">
      <h1>GÖKÇEN ANALİZ</h1>
      <div class="rule"></div>
      <input id="lock-key" type="password" placeholder="Şifre" autocomplete="current-password">
      <button type="submit">Gir</button>
      <p class="meta" id="lock-msg"></p>
    </form>
  </div>
  <div class="frame"><main>
    <h1>GÖKÇEN ANALİZ</h1>
    <div class="rule"></div>
    <h2>Öne Çıkan Analiz</h2>
    <div id="featured" class="meta">Yükleniyor...</div>
    <h2>Opta Monte Carlo Simülasyon</h2>
    <p class="meta" id="meta">Yükleniyor</p>
    <div id="list"></div>
  </main></div>
  <script>
    const PASS_TEXT = "OranAnaliz27";
    function paint(matches) {
      const filtered = matches.filter(m => !String(m.league||"").includes("MAC3") && m.o1 && m.o2);
      filtered.sort((a,b) => (b.opta_max||0) - (a.opta_max||0));
      document.getElementById("meta").textContent = filtered.length + " maç · Opta Supercomputer tarzı Monte Carlo (15.000 sim/maç) — en yüksek ihtimal üstte";
      document.getElementById("list").innerHTML = filtered.slice(0, 80).map(m => {
        const opta = m.opta_max 
          ? `<span class="opta">Opta MC ${m.opta_fav} %${m.opta_max}</span> (${m.opta_p1}/${m.opta_px}/${m.opta_p2}) · ${m.opta_sims||""} sim` 
          : "Opta sim yok";
        return `<article>
          <div class="top"><span>${m.date} ${m.time}</span><span>${m.league}</span></div>
          <div class="teams">${m.home} - ${m.away}</div>
          <div class="pick">${m.o1} / ${m.ox} / ${m.o2} · ${opta}</div>
          <p class="meta">Diğer sitelerle ortak karar: (Forebet/PredictZ/WinDrawWin/Statarea/SoccerVista konsensüsü eklenecek)</p>
        </article>`;
      }).join("") || `<p class="meta">Maç yok.</p>`;
    }
    function load() {
      fetch("bulten.json").then(r => r.json()).then(d => paint(d.matches || [])).catch(() => {
        document.getElementById("meta").textContent = "Bülten açılmadı";
      });
    }
    function unlock() { document.getElementById("lock").classList.add("hide"); load(); }
    if (localStorage.getItem("oran-kapi") === PASS_TEXT) unlock();
    document.getElementById("lock-form").onsubmit = (e) => {
      e.preventDefault();
      if (document.getElementById("lock-key").value.trim() !== PASS_TEXT) {
        document.getElementById("lock-msg").textContent = "Şifre yanlış";
        return;
      }
      localStorage.setItem("oran-kapi", PASS_TEXT);
      unlock();
    };
    async function loadFeatured() {
      try {
        const r = await fetch("analizler/lyon-nice-2026-10-18.json");
        if (!r.ok) throw new Error();
        const a = await r.json();
        const c = a.analysis;
        document.getElementById("featured").innerHTML = `
          <article>
            <div class="teams">${a.home} - ${a.away}</div>
            <div class="pick">${a.date} ${a.time} · ${a.league}</div>
            <p class="meta">${c.summary}</p>
            <p class="meta"><strong>Yorum:</strong> ${c.human_comment}</p>
            <p class="meta"><strong>Tahmin:</strong> ${c.prediction}</p>
          </article>`;
      } catch(e) {
        document.getElementById("featured").textContent = "Analiz yüklenemedi";
      }
    }
    loadFeatured();
  </script>
</body>
</html>
