<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GÖKÇEN ANALİZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0d10; --surface:#14181d; --fg:#f3f0e8; --muted:#9a9386; --line:#2a261f; --gold:#e4d0a2; --green:#1f7a45; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); color:var(--fg); }
    body { font-family:Manrope, sans-serif; padding:10px; }
    .frame { min-height:calc(100vh - 20px); border:1px solid var(--gold); box-shadow:inset 0 0 0 5px var(--bg), inset 0 0 0 6px rgba(228,208,162,.55); padding:10px 8px 28px; }
    main { width:min(720px,100%); margin:0 auto; }
    h1, h2 { font-family:"Bodoni Moda", Georgia, serif; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
    h1 { margin:10px 0 0; text-align:center; font-size:24px; }
    h2 { margin:16px 0 6px; font-size:14px; }
    .rule { width:88px; height:1px; margin:10px auto 14px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
    .meta { color:var(--muted); font-size:13px; }
    input, button { width:100%; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:12px; font:inherit; }
    input { height:44px; padding:0 14px; margin-bottom:8px; }
    button.go, .hour { height:40px; background:#2a2418; color:var(--gold); }
    .hour { width:100%; margin:6px 0 0; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--fg); text-align:left; font-size:13px; }
    .slot { display:none; }
    .slot.open { display:grid; grid-template-columns:1fr; gap:4px; margin-top:4px; }
    article { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:4px; }
    article.g { border-color:var(--green); }
    .top { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
    .teams { margin:2px 0; font-size:14px; font-weight:600; }
    .pick { color:#3dd68c; font-size:13px; }
    .mavi { color:#5aa7ff; font-size:13px; }
    .odds { display:grid; grid-template-columns:repeat(5,1fr); gap:2px; margin-top:4px; }
    .odds b, .odds span { display:block; text-align:center; }
    .odds b { color:var(--muted); font-size:9px; font-weight:500; }
    .odds span { background:var(--bg); border-radius:6px; padding:3px 0; font-size:11px; }
    .gun { display:flex; justify-content:space-between; margin:14px 0 4px; font-size:12px; color:var(--muted); }
    #lock { position:fixed; inset:0; z-index:30; background:#0b0d10; display:flex; align-items:center; justify-content:center; padding:24px; }
    #lock.hide { display:none; }
    #lock form { width:min(320px,100%); }
  </style>
</head>
<body>
  <div id="lock">
    <form id="lock-form">
      <h1>GÖKÇEN ANALİZ</h1>
      <div class="rule"></div>
      <input id="lock-key" type="password" placeholder="Şifre" autocomplete="current-password">
      <button class="go" type="submit">Gir</button>
      <p class="meta" id="lock-msg"></p>
    </form>
  </div>
  <div class="frame"><main>
    <h1>GÖKÇEN ANALİZ</h1>
    <div class="rule"></div>
    <h2>Tercihler</h2>
    <p class="meta" id="tmeta">Yükleniyor</p>
    <div id="picks"></div>
    <h2>Bülten</h2>
    <input id="q" placeholder="Takım veya lig">
    <p class="meta" id="meta">Bülten yükleniyor</p>
    <div id="list"></div>
  </main></div>
  <script>
    const PASS_TEXT = "OranAnaliz27";
    let matches = [];
    let greens = [];
    function n(v) { return v == null ? "—" : Number(v).toFixed(2); }
    function paintPicks(signals) {
      const greenCards = greens.map((row) => {
        const [when, rest] = row.split("|");
        const parts = when.split(" ");
        const odd = rest;
        const name = parts.slice(2).join(" ");
        return `<article class="g"><div class="top"><span>${parts[0]} ${parts[1]}</span><span>yeşil</span></div><div class="teams">${name}</div><div class="pick">MS ${odd}</div></article>`;
      }).join("");
      const signalCards = (signals || []).filter((m) => (m.tags && m.tags.length) || (m.blue && m.blue.length)).map((m) => `<article>
        <div class="top"><span>${m.date} ${m.time}</span><span>${m.league}</span></div>
        <div class="teams">${m.home} - ${m.away}</div>
        <div class="pick">${(m.tags || []).join(" · ")}</div>
        <div class="mavi">${(m.blue || []).join(" · ")}</div>
      </article>`).join("");
      document.getElementById("picks").innerHTML = greenCards + signalCards;
      document.getElementById("tmeta").textContent = greens.length + " yeşil · " + (signals || []).length + " oran sinyali";
    }
    function draw() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const rows = matches.filter((m) => !q || (m.home + " " + m.away + " " + m.league).toLowerCase().includes(q));
      const days = {};
      rows.forEach((m) => {
        const hour = (m.time || "00:00").slice(0, 2);
        days[m.date] = days[m.date] || {};
        days[m.date][hour] = days[m.date][hour] || [];
        days[m.date][hour].push(m);
      });
      document.getElementById("meta").textContent = rows.length + " maç";
      document.getElementById("list").innerHTML = Object.keys(days).map((day) => {
        const hours = Object.keys(days[day]).sort();
        return `<div class="gun"><span>${day}</span><span>${hours.reduce((s, h) => s + days[day][h].length, 0)} maç</span></div>` +
          hours.map((hour) => {
            const id = (day + hour).replace(/\./g, "");
            const cards = days[day][hour].map((m) => `<article>
              <div class="top"><span>${m.time}</span><span>${m.league}</span></div>
              <div class="teams">${m.home} - ${m.away}</div>
              <div class="odds"><b>1</b><b>X</b><b>2</b><b>A</b><b>Ü</b><span>${n(m.o1)}</span><span>${n(m.ox)}</span><span>${n(m.o2)}</span><span>${n(m.alt)}</span><span>${n(m.ust)}</span></div>
            </article>`).join("");
            return `<button class="hour" type="button" data-id="${id}">${hour}:00 · ${days[day][hour].length} maç</button><div class="slot" id="${id}">${cards}</div>`;
          }).join("");
      }).join("");
    }
    document.getElementById("list").onclick = (event) => {
      const button = event.target.closest(".hour");
      if (!button) return;
      document.getElementById(button.dataset.id).classList.toggle("open");
    };
    document.getElementById("q").oninput = draw;
    function load() {
      fetch("yesil_son.json").then((r) => r.json()).then((d) => { greens = d.greens || []; }).catch(() => {});
      fetch("oran_sayfa.json").then((r) => r.json()).then((d) => paintPicks(d.matches || [])).catch(() => paintPicks([]));
      fetch("bulten.json").then((r) => r.json()).then((d) => {
        matches = d.matches || [];
        document.getElementById("meta").textContent = (d.updated || "") + " · " + matches.length + " maç";
        draw();
      }).catch(() => { document.getElementById("meta").textContent = "Bülten açılmadı"; });
    }
    function unlock() { document.getElementById("lock").classList.add("hide"); load(); }
    if (localStorage.getItem("oran-kapi") === PASS_TEXT) unlock();
    document.getElementById("lock-form").onsubmit = (event) => {
      event.preventDefault();
      if (document.getElementById("lock-key").value.trim() !== PASS_TEXT) {
        document.getElementById("lock-msg").textContent = "Şifre yanlış";
        return;
      }
      localStorage.setItem("oran-kapi", PASS_TEXT);
      unlock();
    };
  </script>
</body>
</html>
