<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oran Analiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0d10; --surface:#14181d; --fg:#f3f0e8; --muted:#9a9386; --red:#9c2b2b; --line:#2a261f; --gold:#e4d0a2; --green:#1f7a45; }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--bg); color:var(--fg); }
    body {
      font-family:"Source Sans 3","Segoe UI",sans-serif;
      line-height:1.4;
      min-height:100vh;
      padding:10px;
    }
    .frame {
      min-height:calc(100vh - 20px);
      border:1px solid var(--gold);
      box-shadow:inset 0 0 0 5px var(--bg), inset 0 0 0 6px rgba(228,208,162,0.55);
      padding:10px 8px 28px;
    }
    main { width:min(720px, 100%); margin:0 auto; padding:6px 0 40px; }
    h1 {
      margin:10px 0 0;
      text-align:center;
      font-family:"Cormorant Garamond",Georgia,serif;
      font-weight:500;
      font-size:24px;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:var(--gold);
    }
    .rule { width:88px; height:1px; margin:10px auto 0; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
    .tabs { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:4px; background:var(--surface); padding:4px; border-radius:16px; margin:16px 0; }
    .hide { display:none !important; }
    .tabs button, button.go { height:44px; border:0; border-radius:12px; font-size:13px; }
    .tabs button { background:transparent; color:var(--muted); }
    .tabs button.on { background:#2a2418; color:var(--gold); }
    input, button.go { width:100%; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:12px; }
    input { height:48px; text-align:center; font-size:18px; }
    .sheet { display:grid; grid-template-columns:repeat(5,1fr); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    .sheet div, .sheet input { border-right:1px solid var(--line); }
    .sheet div:last-child, .sheet input:last-child { border-right:0; }
    .sheet .h, .sheet .lift { text-align:center; font-size:12px; color:var(--muted); padding:8px 2px; background:var(--surface); }
    .row { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
    .row button { height:40px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--fg); padding:0 14px; }
    .row button.on { background:#2a2418; border-color:var(--gold); color:var(--gold); }
    button.go { background:#2a2418; color:var(--gold); border:1px solid rgba(228,208,162,0.5); font-weight:600; letter-spacing:0.04em; }
    .meta { color:var(--muted); font-size:14px; }
    article { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-top:8px; }
    article.pick { width:100%; text-align:left; color:inherit; }
    article.on { outline:1px solid var(--gold); }
    #bulten-list button.on {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      outline: 0;
    }
    #bulten-list button.on .top { color: rgba(255,255,255,0.8); }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
    .dot.g { background: var(--green); }
    .dot.s { background: #e6b325; }
    #bulten-list button.sondu { border-color: #e6b325; }
    .lockline { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
    .gun { display:flex; justify-content:space-between; margin:14px 0 6px; font-size:12px; color:var(--muted); }
    .satir { display:flex; justify-content:space-between; gap:8px; padding:7px 0; border-bottom:1px solid rgba(201,162,39,0.25); font-size:14px; }
    .satir b { font-weight:600; }
    .ok { color:#3dd68c; }
    .no { color:#e85d4c; }
    #bulten-list button.on .lockline { color: rgba(255,255,255,0.8); }

    .top { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:13px; }
    .teams { margin:4px 0; font-size:17px; font-weight:600; }
    .odds { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:8px; }
    .odds b, .odds span { display:block; text-align:center; }
    .odds b { color:var(--muted); font-size:11px; font-weight:500; }
    .odds span { background:var(--bg); border-radius:8px; padding:6px 0; }
    .chip { display:inline-block; margin:4px 4px 0 0; padding:3px 8px; border-radius:999px; background:var(--bg); font-size:11px; color:var(--muted); }
    .chip.on { background:var(--green); color:#fff; }
    #uc-list article { padding:10px 12px; margin:0 0 6px; }
    .uc-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:8px 0; }
    .uc-grid div { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; }
    .odds span.hit { background:var(--green); color:#fff; }
    #lock {
      position:fixed; inset:0; z-index:30; background:#0b0d10;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    #lock.hide { display:none; }
    #lock form { width:min(320px, 100%); }
    #lock input { margin:18px 0 10px; }
    #bulten-list article { padding: 4px 6px; margin: 0; border-radius: 8px; min-width: 0; }
    #bulten-list .top { font-size: 10px; }
    #bulten-list .teams { margin: 0; font-size: 12px; font-weight: 600; line-height: 1.2; }
    .hour {
      width: 100%;
      margin: 6px 0 0;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      text-align: left;
      font-size: 12px;
    }
    .slot { display: none; }
    .slot.open { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px; }
    #second { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:8px 0; }
    #second div { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; }
    #second strong { font-weight:600; }
    #hits article { padding: 6px 8px; margin: 0; border-radius: 8px; }
    #hits .top { font-size: 12px; }
    #hits .sum { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 0; background: transparent; border: 0; }
    #hits .sum div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
    #hits .sum div.good, #hits .sum div.good span { background: var(--green); color: #fff; border-color: var(--green); }
  </style>
</head>
<body>
  <div id="lock">
    <form id="lock-form">
      <h1>Oran Analiz</h1>
      <div class="rule"></div>
      <input id="lock-key" type="password" placeholder="Şifre" autocomplete="current-password">
      <button class="go" type="submit">Gir</button>
      <p class="meta" id="lock-msg"></p>
    </form>
  </div>
  <div class="frame">
  <main>
    <h1>Oran Analiz</h1>
    <div class="rule"></div>
    <div class="tabs">
      <button id="tab-bulten" class="on" type="button">Bülten</button>
      <button id="tab-sonuc" type="button">Sonuç</button>
      <button id="tab-ucoran" type="button">youtube</button>
    </div>

    <section id="panel-sonuc" class="hide">
      <p class="meta" id="sonuc-meta">Yeşil kilitlerin günü.</p>
      <div id="sonuc-list"></div>
    </section>

    <section id="panel-ucoran" class="hide">
      <p class="meta" id="uc-meta">Beş ayrı filtre: 1,5 üst · 4,5 üst · 2/1 · İY 2-1 · iki yarı KG.</p>
      <div id="uc-sum"></div>
      <div id="uc-list"></div>
    </section>

    <section id="panel-bulten">
      <input id="q" placeholder="Takım veya lig" style="text-align:left;padding:0 14px;margin-bottom:8px">
      <p class="meta" id="bmeta">Bülten yükleniyor</p>
      <div id="bulten-list"></div>
    </section>

    <div id="analiz-tools">
    <div class="row" id="tol">
      <button type="button" data-t="0.05">Sıkı ±0.05</button>
      <button type="button" data-t="0.08" class="on">Yakın ±0.08</button>
      <button type="button" data-t="0.12">Geniş ±0.12</button>
    </div>
    <button class="go" id="ara" type="button">Eski maçları bul</button>
    <p class="meta" id="aranan"></p>
    <div id="second"></div>
    <p class="meta" id="meta">Bültende üç tolerans otomatik. Biri yeşilse yeşil yazar. Dört oran doluysa en az dört tutmalı.</p>
    <div id="hits"></div>
    </div>
  </main>
  <script>
    const BANDS = [
      [1.2, 1.053], [1.4, 0.902], [1.6, 0.893], [1.8, 0.886], [2.1, 0.89],
      [2.5, 0.875], [3, 0.86], [3.8, 0.906], [5, 0.85], [7, 0.833], [10, 0.786], [1e9, 0.658]
    ];
    const KEYS = ["o1", "ox", "o2", "alt", "ust"];
    const LIFT = ["l1", "lx", "l2", "la", "lu"];
    const SHORT = ["1", "X", "2", "A2.5", "Ü2.5"];
    let tab = "bulten";
    const EUROPE = [
      { home:"Raelingen", away:"Lyn Oslo B", time:"19:00", side:"2", iddaa:6.82, europe:2.15, gap:30 },
      { home:"Guadeloupe", away:"Barbados", time:"22:00", side:"1", iddaa:2.14, europe:1.90, gap:10 },
      { home:"Atletico Tembe", away:"Paraguari", time:"23:00", side:"2", iddaa:2.25, europe:2.02, gap:8 },
      { home:"Leixoes U23", away:"Vizela U23", time:"18:00", side:"1", iddaa:2.16, europe:1.99, gap:7 },
      { home:"C Espanol", away:"Cambaceres", time:"21:00", side:"1", iddaa:1.68, europe:1.62, gap:7 }
    ];
    let tol = 0.08;
    let archive = null;
    let bulletin = [];
    let picked = null;

    function band(price) {
      for (const row of BANDS) if (price < row[0]) return row[1];
      return 0.658;
    }
    function lift(iddaa) {
      let guess = iddaa / 0.88;
      for (let i = 0; i < 5; i++) guess = iddaa / band(guess);
      return Math.round(guess * 100) / 100;
    }
    function num(value) {
      const n = parseFloat(String(value).replace(",", "."));
      return Number.isFinite(n) && n > 1 ? n : null;
    }
    function activeFrom(raw) {
      return KEYS.map((key, index) => {
        const iddaa = num(raw[key]);
        return iddaa == null ? null : { index: index + 5, iddaa, bet365: lift(iddaa), short: SHORT[index] };
      }).filter(Boolean);
    }
    function readManual() {
      const raw = {};
      KEYS.forEach((key, i) => {
        raw[key] = document.getElementById(key).value;
        const n = num(raw[key]);
        document.getElementById(LIFT[i]).textContent = n == null ? "—" : lift(n).toFixed(2);
      });
      return raw;
    }
    function scoreOf(row) {
      const [h, a] = String(row[4] || "").split("-").map(Number);
      if (!Number.isFinite(h) || !Number.isFinite(a)) return "";
      return h > a ? "MS 1" : h === a ? "MS X" : "MS 2";
    }
    function minimumFor(count) {
      return count >= 4 ? 4 : 2;
    }
    function find(raw, band) {
      const width = band != null ? band : tol;
      const active = activeFrom(raw);
      const minimum = minimumFor(active.length);
      if (active.length < 2) return { active, hits: [], need: true, minimum, band: width };
      const hits = [];
      for (const row of archive) {
        let matched = 0, gap = 0;
        const flags = [];
        for (const market of active) {
          const price = row[market.index];
          const ok = typeof price === "number" && Math.abs(price - market.bet365) <= width + 0.001;
          flags.push(ok);
          if (ok) { matched += 1; gap += Math.abs(price - market.bet365); }
        }
        if (matched >= minimum) hits.push({ row, matched, gap, flags });
      }
      hits.sort((a, b) => b.matched - a.matched || a.gap - b.gap);
      return { active, hits, minimum, band: width };
    }
    function greenSide(found) {
      if (!found || found.need) return "";
      let home = 0, draw = 0, away = 0;
      for (const hit of found.hits) {
        const result = scoreOf(hit.row);
        if (result === "MS 1") home += 1;
        else if (result === "MS X") draw += 1;
        else if (result === "MS 2") away += 1;
      }
      const total = found.hits.length;
      const counts = { "1": home, "X": draw, "2": away };
      const trio = found.active.filter((market) => market.short === "1" || market.short === "X" || market.short === "2");
      const favorite = trio.reduce((best, market) => (!best || market.iddaa < best.iddaa ? market : best), null);
      const leader = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      const low = wilsonLower(leader ? leader[1] : 0, total);
      return favorite && leader && total >= 200 && leader[0] === favorite.short && low > 0.55 ? leader[0] : "";
    }
    function wilsonLower(hits, n) {
      if (!n) return 0;
      const z = 1.96;
      const p = hits / n;
      const den = 1 + (z * z) / n;
      const centre = p + (z * z) / (2 * n);
      const marg = z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n));
      return (centre - marg) / den;
    }
    function loadSonuc() {
      fetch("sonuc.json").then((res) => res.json()).then(paintSonuc).catch(() => {
        const meta = document.getElementById("sonuc-meta");
        if (meta) meta.textContent = "Sonuç açılmadı";
      });
    }
    function loadBulletin() {
      fetch("bulten.json").then((res) => res.json()).then((data) => {
        bulletin = data.matches || [];
        drawBulletin();
        scanGreens();
      }).catch(() => { document.getElementById("bmeta").textContent = "Bülten açılmadı"; });
    }
    if (document.getElementById("o1")) readManual();
    const PASS_TEXT = "OranAnaliz27";
    function unlock() {
      document.getElementById("lock").classList.add("hide");
      if (!unlock.done) { unlock.done = true; loadBulletin(); loadUc(); loadMacs(); loadSonuc(); }
    }
    if (localStorage.getItem("oran-kapi") === PASS_TEXT) unlock();
    document.getElementById("lock-form").onsubmit = (event) => {
      event.preventDefault();
      const raw = document.getElementById("lock-key").value.trim();
      if (raw !== PASS_TEXT) {
        document.getElementById("lock-msg").textContent = "Şifre yanlış";
        return;
      }
      localStorage.setItem("oran-kapi", PASS_TEXT);
      unlock();
    };
  </script>
  </div>
</body>
</html>
