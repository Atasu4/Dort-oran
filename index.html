<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dört Oran</title>
  <style>
    :root {
      --bg: #0c1014;
      --surface: #151b21;
      --fg: #f4f7f8;
      --muted: #93a1aa;
      --red: #e30a17;
      --azure: #00a3d7;
      --green: #0e7a3d;
      --line: #2c3842;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font-family: "Segoe UI", sans-serif; line-height: 1.4; }
    .rail { display: flex; height: 6px; }
    .rail span { flex: 1; }
    .rail .a { background: var(--azure); }
    .rail .r { background: var(--red); }
    .rail .g { background: var(--green); }
    main { width: min(720px, calc(100% - 24px)); margin: 0 auto; padding: 20px 0 48px; }
    h1 { margin: 0; font-size: 28px; }
    .kicker { margin: 0; color: var(--muted); font-size: 14px; }
    input {
      width: 100%;
      height: 44px;
      margin: 16px 0 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--fg);
      padding: 0 14px;
      font-size: 16px;
    }
    .meta { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
    article {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      margin-top: 8px;
    }
    .top { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
    .teams { margin: 4px 0; font-size: 17px; font-weight: 600; }
    .odds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
    .odds b, .odds span { display: block; text-align: center; }
    .odds b { color: var(--muted); font-size: 11px; font-weight: 500; }
    .odds span {
      background: var(--bg);
      border-radius: 8px;
      padding: 6px 0;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="rail" aria-hidden="true"><span class="a"></span><span class="r"></span><span class="g"></span></div>
  <main>
    <p class="kicker">Günün bülteni</p>
    <h1>Dört Oran</h1>
    <input id="q" placeholder="Takım veya lig ara" autocomplete="off">
    <p class="meta" id="meta">Bülten yükleniyor</p>
    <div id="list"></div>
  </main>
  <script>
    const list = document.getElementById("list");
    const meta = document.getElementById("meta");
    const box = document.getElementById("q");
    let matches = [];

    function odd(value) {
      return value == null ? "—" : Number(value).toFixed(2);
    }

    function draw() {
      const needle = box.value.trim().toLocaleLowerCase("tr");
      const rows = needle
        ? matches.filter((m) => `${m.home} ${m.away} ${m.league}`.toLocaleLowerCase("tr").includes(needle))
        : matches;
      meta.textContent = rows.length + " maç";
      list.innerHTML = rows.map((m) => `
        <article>
          <div class="top"><span>${m.time || ""}</span><span>${m.league || ""}</span></div>
          <div class="teams">${m.home} – ${m.away}</div>
          <div class="odds">
            <div><b>1</b><span>${odd(m.o1)}</span></div>
            <div><b>X</b><span>${odd(m.ox)}</span></div>
            <div><b>2</b><span>${odd(m.o2)}</span></div>
            <div><b>Alt</b><span>${odd(m.alt)}</span></div>
            <div><b>Üst</b><span>${odd(m.ust)}</span></div>
          </div>
        </article>`).join("");
    }

    fetch("2026-09-26.json")
      .then((res) => res.json())
      .then((data) => {
        matches = data.matches || [];
        draw();
      })
      .catch(() => {
        meta.textContent = "Bülten açılmadı";
      });

    box.addEventListener("input", draw);
  </script>
</body>
</html>
