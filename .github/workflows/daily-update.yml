name: Daily Bulten + Opta Update

on:
  schedule:
    # Her gün 06:30 UTC (09:30 TR) ve 18:30 UTC (21:30 TR)
    - cron: '30 6 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:  # manuel tetikleme

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh bulten
        run: python scripts/refresh_bulten.py

      - name: Run Opta Monte Carlo + Consensus
        run: python scripts/master_analyzer.py

      - name: Commit updated bulten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulten.json app_summary.json
          git diff --staged --quiet || git commit -m "Günlük güncelleme: bülten + Opta MC + konsensüs [$(date -u +%Y-%m-%d)]"
          git push
